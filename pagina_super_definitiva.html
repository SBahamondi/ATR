<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR · Adolescentes Trabajadores Regulados</title>
<link rel="icon" href="assets/logo-atr-circulo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161B33;
    --ink-soft:#4A4F72;
    --bg:#F5F5FA;
    --bg-card:#FFFFFF;
    --line:#E3E2EF;
    --raspberry:#FF3D68;
    --raspberry-dark:#D81C4B;
    --teal:#06A77D;
    --teal-soft:#E4F7F1;
    --raspberry-soft:#FFE7ED;
    --amber:#FFB020;
    --radius:18px;
    --shadow: 0 8px 30px -12px rgba(22,27,51,0.18);
    --red-alert: #E63946;
    --green-success: #06A77D;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2,h3,.display{font-family:'Fredoka',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;text-transform:uppercase;}

  #app{min-height:100vh;display:flex;flex-direction:column;}
  
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;background:var(--bg-card);border-bottom:1px solid var(--line);}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fredoka',sans-serif;font-weight:700;font-size:22px;color:var(--ink);}
  .logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--raspberry),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;}
  
  .topbar-user{display:flex;align-items:center;gap:16px;}
  .user-info{text-align:right;}
  .user-name{font-weight:600;font-size:14px;}
  .user-role{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
  .user-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--raspberry),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;}
  
  .btn-logout{background:none;border:none;padding:8px 16px;border-radius:8px;color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;transition:all .15s;}
  .btn-logout:hover{background:var(--raspberry-soft);color:var(--raspberry-dark);}

  main{flex:1;display:flex;padding:24px;}
  .screen{width:100%;max-width:100%;}
  .screen.auth-only{max-width:460px;margin:auto;}

  .sidebar{width:240px;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:0;margin-right:24px;display:flex;flex-direction:column;height:fit-content;}
  .sidebar-item{padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-soft);transition:all .15s;}
  .sidebar-item:hover{background:var(--bg);color:var(--ink);}
  .sidebar-item.active{background:var(--teal-soft);color:var(--teal);border-left:4px solid var(--teal);padding-left:14px;}
  .sidebar-item:last-child{border-bottom:none;}

  .content-wrapper{flex:1;}
  .dashboard{display:flex;gap:24px;}
  .dashboard-main{flex:1;}

  .card{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);padding:36px;}
  .card-sm{padding:24px;}
  .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:16px;}
  .card-title{font-size:18px;font-weight:700;margin:0;}
  
  .eyebrow{font-size:12px;font-weight:600;color:var(--raspberry-dark);margin:0 0 6px;}
  .title{font-size:28px;margin:0 0 6px;line-height:1.15;}
  .subtitle{color:var(--ink-soft);font-size:14px;margin:0 0 28px;}

  label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px;color:var(--ink);}
  label.req::after{content:" *";color:var(--raspberry);}
  input[type=text],input[type=password],input[type=email],input[type=number],input[type=tel],input[type=date],input[type=time],textarea,select{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    font-family:'Inter',sans-serif;font-size:14px;background:#FBFBFD;color:var(--ink);
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--raspberry);background:#fff;}
  textarea{resize:vertical;min-height:80px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}

  .check-row{display:flex;align-items:flex-start;gap:10px;margin-top:18px;background:var(--raspberry-soft);padding:12px 14px;border-radius:12px;}
  .check-row input{width:18px;height:18px;margin-top:2px;flex-shrink:0;}
  .check-row span{font-size:12.5px;color:var(--ink-soft);line-height:1.4;}

  .btn{border:none;border-radius:12px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s, box-shadow .12s;padding:12px 20px;display:inline-flex;align-items:center;gap:8px;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ink);color:#fff;width:100%;padding:14px;}
  .btn-primary:hover{box-shadow:0 6px 18px -6px rgba(22,27,51,0.5);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink);color:var(--ink);}
  .btn-secondary{background:var(--teal);color:#fff;}
  .btn-secondary:hover{background:var(--teal-soft);color:var(--teal);}
  .btn-danger{background:var(--red-alert);color:#fff;}
  .btn-danger:hover{opacity:0.9;}
  .btn-sm{padding:8px 12px;font-size:12px;}
  .btn-xs{padding:6px 10px;font-size:11px;}

  .spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:-3px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .error-box{display:none;background:#FFF0F1;border:1px solid #FFC4CC;color:#B3273F;font-size:13px;padding:10px 14px;border-radius:10px;margin-top:16px;font-weight:500;}
  .error-box.show{display:block;}
  .success-box{display:none;background:var(--teal-soft);border:1px solid #BEEBDC;color:var(--teal);font-size:13px;padding:10px 14px;border-radius:10px;margin-top:16px;font-weight:500;}
  .success-box.show{display:block;}
  .warning-box{display:none;background:#FFF4E6;border:1px solid #FFD699;color:#B8860B;font-size:13px;padding:10px 14px;border-radius:10px;margin-top:16px;font-weight:500;}
  .warning-box.show{display:block;}

  .role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .role-card{border:2px solid var(--line);border-radius:16px;padding:24px 18px;text-align:center;cursor:pointer;background:#FBFBFD;transition:.15s;}
  .role-card:hover{border-color:var(--raspberry);transform:translateY(-2px);}
  .role-card .icon{width:52px;height:52px;border-radius:14px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:24px;}
  .role-card.tutor .icon{background:var(--teal-soft);}
  .role-card.teen .icon{background:var(--raspberry-soft);}
  .role-card.employer .icon{background:#E8F4F8;}
  .role-card h3{margin:0 0 6px;font-size:16px;}
  .role-card p{margin:0;font-size:12.5px;color:var(--ink-soft);}

  .section-label{display:flex;align-items:center;gap:10px;margin:26px 0 6px;}
  .section-label .num{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;}
  .section-label span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}

  .link-row{text-align:center;margin-top:20px;font-size:13.5px;color:var(--ink-soft);}
  .link-row a{color:var(--raspberry-dark);font-weight:600;text-decoration:none;cursor:pointer;}
  .link-row a:hover{text-decoration:underline;}

  .top-link{background:none;border:none;color:var(--ink-soft);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0;margin-bottom:18px;font-weight:600;}
  .top-link:hover{color:var(--ink);}

  .calendar-container{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--line);padding:24px;}
  .calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
  .calendar-header h3{margin:0;font-size:18px;}
  .calendar-nav{display:flex;gap:8px;}
  .calendar-nav button{background:none;border:1px solid var(--line);padding:6px 10px;border-radius:6px;cursor:pointer;font-weight:600;}
  .calendar-nav button:hover{border-color:var(--ink);background:var(--bg);}

  .week-view{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
  .day-cell{border:1px solid var(--line);border-radius:12px;padding:12px;min-height:400px;background:#FBFBFD;position:relative;}
  .day-cell.today{background:var(--teal-soft);border-color:var(--teal);}
  .day-cell.weekend{background:var(--raspberry-soft);opacity:0.6;}
  
  .day-header{font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em;}
  .day-date{font-size:11px;color:var(--ink-soft);}

  .time-slot{font-size:11px;color:var(--ink-soft);margin-top:8px;padding:4px;border-radius:4px;}
  .time-slot.blocked{background:#FFE7ED;color:var(--raspberry-dark);font-weight:600;}
  .time-slot.work{background:var(--teal-soft);color:var(--teal);font-weight:600;}
  .time-slot.school{background:var(--amber);color:#8B6914;font-weight:600;opacity:0.8;}

  .calendar-legend{display:flex;gap:20px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
  .legend-color{width:16px;height:16px;border-radius:4px;}

  .offer-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#FBFBFD;margin-bottom:12px;cursor:pointer;transition:all .15s;}
  .offer-card:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow);}
  .offer-card.blocked{opacity:0.6;cursor:not-allowed;}
  
  .offer-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .offer-title{font-weight:700;font-size:15px;}
  .offer-badge{display:inline-block;background:var(--teal-soft);color:var(--teal);padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600;}
  .offer-badge.blocked{background:var(--raspberry-soft);color:var(--raspberry-dark);}
  
  .offer-details{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
  .offer-detail-item{display:flex;gap:6px;}
  .offer-detail-item strong{color:var(--ink);}


  .stat-card{background:var(--bg-card);border-radius:14px;border:1px solid var(--line);padding:16px;margin-bottom:12px;}
  .stat-label{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
  .stat-value{font-size:24px;font-weight:700;color:var(--ink);margin:8px 0 0;}
  .stat-card.alert{border-color:var(--red-alert);background:#FFF0F1;}
  .stat-card.alert .stat-value{color:var(--red-alert);}

  .student-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg-card);margin-bottom:12px;cursor:pointer;transition:all .15s;}
  .student-card:hover{border-color:var(--teal);transform:translateY(-2px);}
  .student-header{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .student-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--raspberry),var(--teal));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;}
  .student-name{font-weight:600;font-size:14px;}
  .student-status{font-size:11px;color:var(--ink-soft);margin-top:6px;}

  footer{text-align:center;padding:18px;font-size:11.5px;color:var(--ink-soft);border-top:1px solid var(--line);}

  .loading{text-align:center;padding:40px;color:var(--ink-soft);}

  @media(max-width:1024px){
    .dashboard{flex-direction:column;}
    .sidebar{width:100%;margin-right:0;margin-bottom:24px;}
    .role-grid{grid-template-columns:1fr;}
    .row3{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:768px){
    main{padding:16px;}
    .card{padding:20px;}
    .topbar{padding:16px;}
    .row2, .week-view{grid-template-columns:1fr;}
    }

  /* ===== Tema Canva (azul noche) — sobreescribe variables y componentes ===== */
  :root{
    --ink:#EAF1FF; --ink-soft:#9FB3DA; --bg:#07112E; --bg-card:#0F2457; --bg-panel:#12295F; --bg-field:#0A1B47;
    --line:rgba(96,165,250,.22); --raspberry:#FF7A0A; --raspberry-dark:#FF9440; --raspberry-soft:rgba(255,122,10,.16);
    --teal:#25B8FF; --teal-soft:rgba(37,184,255,.16); --blue:#0A4FE0; --amber:#FDE68A; --red-alert:#FF7A0A;
    --shadow:0 10px 30px -14px rgba(0,0,0,.6);
  }
  body{background:var(--bg);}
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px;}
  .topbar{background:var(--bg-panel);border-bottom:3px solid rgba(255,255,255,.1);padding:10px 28px;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:50;}
  .brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-family:'Fredoka',sans-serif;font-weight:700;font-size:20px;}
  .brand img{width:46px;height:46px;display:block;}
  .main-nav{display:flex;gap:6px;flex:1;align-items:center;}
  .nav-btn{display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink);font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;padding:10px 14px;border-radius:10px;cursor:pointer;position:relative;}
  .nav-btn svg{width:20px;height:20px;stroke:var(--teal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .nav-btn:hover{background:rgba(37,184,255,.12);}
  .nav-btn.active::after{content:'';position:absolute;left:12px;right:12px;bottom:2px;height:3px;border-radius:2px;background:var(--raspberry);}
  .nav-btn.right{margin-left:auto;}
  .nav-dot{background:var(--raspberry);color:#1a0a00;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700;}
  .user-avatar,.student-avatar{background:linear-gradient(135deg,var(--blue),var(--teal));}
  .btn-logout:hover{background:var(--raspberry-soft);color:var(--raspberry-dark);}
  main{padding:24px 28px;}
  .card,.calendar-container,.stat-card,.student-card{background:var(--bg-card);border-color:var(--line);}
  .sidebar{background:var(--bg-panel);width:300px;flex-shrink:0;border-radius:var(--radius);}
  .sidebar-item:hover{background:rgba(37,184,255,.1);}
  .sidebar-item.active{background:var(--teal-soft);color:var(--teal);border-left-color:var(--raspberry);}
  .profile-panel{padding:20px;border-bottom:1px solid var(--line);}
  .profile-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .profile-head .user-avatar{width:54px;height:54px;font-size:20px;flex-shrink:0;}
  .profile-head strong{display:block;font-family:'Fredoka',sans-serif;font-size:17px;}
  .profile-head span{font-size:12px;color:var(--ink-soft);}
  .profile-row{font-size:13px;margin:8px 0;color:var(--ink-soft);}
  .profile-row b{color:var(--ink);font-weight:600;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .tag{background:rgba(159,179,218,.18);color:var(--ink);border-radius:999px;padding:3px 11px;font-size:12px;}
  input[type=text],input[type=password],input[type=email],input[type=number],input[type=tel],input[type=date],input[type=time],textarea,select{background:var(--bg-field);color:var(--ink);border-color:var(--line);color-scheme:dark;}
  input:focus,select:focus,textarea:focus{background:var(--bg-field);border-color:var(--teal);}
  .btn-primary{background:var(--raspberry);color:#1a0a00;}
  .btn-primary:hover{background:#ff9440;box-shadow:none;}
  .btn-secondary{background:var(--blue);color:#fff;}
  .btn-secondary:hover{background:var(--teal);color:#04122e;}
  .btn-ghost{color:var(--teal);border-color:var(--teal);}
  .btn-ghost:hover{background:var(--teal-soft);color:var(--teal);border-color:var(--teal);}
  .btn-danger{background:transparent;color:var(--raspberry-dark);border:1.5px solid var(--raspberry);}
  .error-box{background:rgba(255,122,10,.12);border-color:var(--raspberry);color:#FFC48F;}
  .warning-box{background:rgba(253,230,138,.1);border-color:rgba(253,230,138,.5);color:var(--amber);}
  .success-box{background:var(--teal-soft);border-color:var(--teal);color:var(--teal);}
  .check-row,.role-card{background:var(--bg-field);}
  .role-card:hover{border-color:var(--teal);}
  .day-cell{background:var(--bg-field);}
  .day-cell.today{background:var(--teal-soft);border-color:var(--teal);}
  .day-cell.weekend{background:rgba(255,122,10,.08);}
  .time-slot.blocked{background:rgba(255,122,10,.18);color:#FFC48F;}
  .time-slot.work{background:var(--teal-soft);color:var(--teal);}
  .time-slot.school{background:rgba(253,230,138,.22);color:var(--amber);opacity:1;}
  .calendar-nav button{color:var(--ink);}
  /* Tarjetas de oferta (layout Canva) */
  .offer-card{position:relative;background:var(--bg-panel);border-color:var(--line);padding:20px 22px;border-radius:16px;}
  .offer-card:hover{border-color:var(--teal);transform:none;}
  .offer-card.blocked{opacity:.85;}
  .offer-header{padding-right:130px;}
  .offer-title{font-family:'Fredoka',sans-serif;font-size:19px;}
  .offer-badge{position:absolute;top:16px;right:16px;display:inline-flex;align-items:center;gap:6px;background:var(--teal);color:#04122e;font-size:12px;padding:5px 12px;border-radius:999px;font-weight:600;}
  .offer-badge.blocked{background:#F59A4B;color:#1a0a00;}
  .offer-badge svg,.co-line svg{width:15px;height:15px;flex-shrink:0;}
  .co-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .offer-details{color:var(--ink-soft);font-size:13.5px;}
  .search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .search-row input[type=text]{flex:1;min-width:200px;border-radius:999px;padding:11px 18px;background:#fff;color:#111;border:2px solid var(--blue);}
  .search-row input[type=text]::placeholder{color:#555;}
  .search-row select{width:auto;border-radius:999px;}
  /* Inicio */
  .hero{display:grid;grid-template-columns:1.3fr .7fr;gap:28px;align-items:center;padding:40px;border-radius:18px;border:1px solid var(--line);
    background:radial-gradient(520px 260px at 90% 10%,rgba(37,184,255,.25),transparent 70%),radial-gradient(420px 260px at 0% 110%,rgba(255,122,10,.2),transparent 70%),var(--bg-panel);}
  .hero h1{font-size:clamp(28px,4vw,44px);margin:0 0 12px;line-height:1.1;}
  .hero p{color:var(--ink-soft);font-size:16.5px;max-width:56ch;margin:0 0 22px;}
  .hero img{width:100%;max-width:260px;justify-self:center;}
  .btn-inline{display:inline-block;width:auto;padding:12px 20px;}
  .home-sec{margin-top:22px;}
  .home-sec h2{font-size:24px;margin:0 0 6px;}
  .home-sec>p{color:var(--ink-soft);margin:0 0 14px;max-width:70ch;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .info-card{background:var(--bg-field);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:12px;padding:18px;}
  .info-card:nth-child(2){border-top-color:var(--teal);} .info-card:nth-child(3){border-top-color:var(--raspberry);}
  .info-card h3{margin:0 0 6px;font-size:17px;} .info-card p{margin:0;font-size:14px;color:var(--ink-soft);}
  details.man{background:var(--bg-field);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;}
  details.man summary{cursor:pointer;padding:14px 18px;font-family:'Fredoka',sans-serif;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details.man summary::after{content:'+';color:var(--teal);font-size:22px;} details.man[open] summary::after{content:'–';}
  details.man ol,details.man ul{margin:0;padding:0 18px 16px 38px;color:var(--ink-soft);font-size:14.5px;line-height:1.6;}
  .soon{background:var(--amber);color:#2a2000;border-radius:999px;font-size:11px;font-weight:700;padding:2px 9px;margin-left:6px;}

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.0'

/* ============ SUPABASE CONFIG ============ */
const SUPABASE_URL = 'https://uhaoomiguwssiqnkecec.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoYW9vbWlndXdzc2lxbmtlY2VjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODcxMDIsImV4cCI6MjEwNDM2MzEwMn0.z-5SBQP_kmou8uURpvNgRxUA-TIuqQr06tIEjdRLzGA'
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

/* ============ STATE ============ */
const state = {
  screen: 'landing',
  allTags: [],
  offerTags: [],
  filterOpen: false,
  currentUser: null,
  currentTab: 'dashboard',
  calendarWeekStart: new Date(new Date().setDate(new Date().getDate() - new Date().getDay())),
  allUsers: [],
  allOffers: [],
  allAssignments: [],
  offerFilter: 'all',
  offerQuery: '',
  flash: ''
}

/* ============ INIT ============ */
async function init(){
  try {
    const session = localStorage.getItem('atr_session')
    if(session){
      const sessionUser = JSON.parse(session)
      await loadAllData()
      const fresh = state.allUsers.find(u => u.id === sessionUser.id)
      if(fresh){
        state.currentUser = fresh
        state.currentTab = 'home'
      } else {
        // sesión huérfana: el usuario ya no existe (o no se pudo cargar)
        localStorage.removeItem('atr_session')
      }
    }
  } catch(e){
    console.error('Error en init:', e)
    localStorage.removeItem('atr_session')
  }
  render()
}

async function loadAllData(){
  const results = await Promise.allSettled([
    supabase.from('users').select('*'),
    supabase.from('offers').select('*').order('id'),
    supabase.from('assignments').select('*').order('id'),
    supabase.from('tags').select('*').order('sort_order')
  ])
  // Si una consulta falla se conservan los datos anteriores (no se vacía el estado)
  const pick = (r, name, prev) => {
    if(r.status !== 'fulfilled'){ console.error('Error cargando ' + name + ':', r.reason); return prev }
    if(r.value.error){ console.error('Error cargando ' + name + ':', r.value.error); return prev }
    return r.value.data || []
  }
  state.allUsers = pick(results[0], 'users', state.allUsers)
  state.allOffers = pick(results[1], 'offers', state.allOffers)
  state.allAssignments = pick(results[2], 'assignments', state.allAssignments)
  state.allTags = pick(results[3], 'tags', state.allTags)
}

/* ============ ROUTER ============ */
function go(screen, tab='dashboard'){
  window.scrollTo(0, 0)
  state.screen = screen
  state.currentTab = tab
  render()
}

/* ============ HELPERS ============ */
function calcAge(dobStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dobStr || '')
  if(!m) return NaN
  const now = new Date()
  let age = now.getFullYear() - Number(m[1])
  const beforeBirthday = (now.getMonth() + 1) < Number(m[2]) || ((now.getMonth() + 1) === Number(m[2]) && now.getDate() < Number(m[3]))
  if(beforeBirthday) age--
  return age
}
function isValidUsername(u){
  return /^[A-Za-z0-9._-]{3,30}$/.test(u)
}
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
}
function showBox(el, msg, type='error'){
  if(!el) return
  el.textContent = msg
  el.className = type === 'error' ? 'error-box show' : type === 'success' ? 'success-box show' : 'warning-box show'
}
function hideBox(el){
  if(el) el.className = el.className.replace(' show','')
}
function setLoading(btn, loading, labelDefault){
  if(!btn) return
  btn.disabled = loading
  btn.innerHTML = loading ? `<span class="spinner"></span>Procesando...` : labelDefault
}
function getInitial(name){
  return name ? name.charAt(0).toUpperCase() : '?'
}

function getWeekDays(){
  const days = []
  for(let i = 0; i < 7; i++){
    const d = new Date(state.calendarWeekStart)
    d.setDate(d.getDate() + i)
    days.push(d)
  }
  return days
}

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

function toMinutes(t){
  const [h, m] = String(t || '0:0').split(':')
  return (parseInt(h, 10) || 0) * 60 + (parseInt(m, 10) || 0)
}

// Rangos que cruzan medianoche (ej. 20:00-08:00) se parten en dos tramos.
function timeSlotCollides(startTime, endTime, blockedRanges){
  const s = toMinutes(startTime)
  const e = toMinutes(endTime)
  for(const range of blockedRanges){
    if(!range[0] || !range[1]) continue
    const rs = toMinutes(range[0])
    const re = toMinutes(range[1])
    const segments = re > rs ? [[rs, re]] : [[rs, 1440], [0, re]]
    for(const [a, b] of segments){
      if(s < b && e > a) return true
    }
  }
  return false
}

/* ============ TAGS ============ */
async function ensureTags(){
  if(state.allTags.length) return
  const { data, error } = await supabase.from('tags').select('*').order('sort_order')
  if(error) console.error('Error cargando tags:', error)
  else state.allTags = data || []
}
function tagLabel(slug){ return (state.allTags.find(t => t.slug === slug) || {}).label || slug }
function tagsHTML(tags, mine = []){
  if(!(tags || []).length) return ''
  return `<div class="tags" style="margin-top:10px;">${tags.map(s => `<span class="tag ${mine.includes(s) ? 'mine' : ''}">${esc(tagLabel(s))}</span>`).join('')}</div>`
}
// Selector de tags estilo Pinterest/Reddit: elegidos arriba (con ✕), buscador y catálogo agrupado
function mountTagPicker(el, { max = 10, min = 1 } = {}){
  if(!el) return
  const sel = new Set(); let q = ''
  el.innerHTML = `<div class="tp-selected"></div><div class="tp-count"></div><input type="text" class="tp-q" placeholder="Buscar…" style="margin-top:10px;" aria-label="Buscar etiquetas"><div class="tp-all"></div>`
  const $ = c => el.querySelector(c)
  const drawSel = () => {
    $('.tp-selected').innerHTML = sel.size
      ? [...sel].map(s => `<button type="button" class="chip on" data-t="${esc(s)}" aria-label="Quitar ${esc(tagLabel(s))}">${esc(tagLabel(s))} ✕</button>`).join('')
      : '<span class="tp-count">Todavía no elegiste ninguna.</span>'
    $('.tp-count').textContent = `${sel.size} de ${max} elegidas (mínimo ${min})`
  }
  const drawAll = () => {
    const groups = {}
    state.allTags.filter(t => !q || t.label.toLowerCase().includes(q)).forEach(t => (groups[t.group_name] = groups[t.group_name] || []).push(t))
    $('.tp-all').innerHTML = Object.entries(groups).map(([g, ts]) =>
      `<div class="tp-group">${esc(g)}</div><div class="tp-chips">${ts.map(t => `<button type="button" class="chip ${sel.has(t.slug) ? 'on' : ''}" data-t="${esc(t.slug)}">${sel.has(t.slug) ? '✓ ' : ''}${esc(t.label)}</button>`).join('')}</div>`
    ).join('') || '<p class="hint">Sin resultados.</p>'
  }
  el.onclick = e => {
    const b = e.target.closest('[data-t]'); if(!b) return
    const s = b.dataset.t
    if(sel.has(s)) sel.delete(s)
    else if(sel.size < max) sel.add(s)
    else return
    drawSel(); drawAll()
  }
  $('.tp-q').oninput = e => { q = e.target.value.trim().toLowerCase(); drawAll() }
  el._get = () => [...sel]
  drawSel(); drawAll()
}
function activeFilterCount(){ return state.offerTags.length + (state.offerFilter !== 'all' ? 1 : 0) }
function filterPanelHTML(){
  const used = [...new Set(state.allOffers.flatMap(o => o.tags || []))]
  const mine = state.currentUser.interests || []
  return `<div class="filter-panel">
    <label style="margin-top:0;">Categoría</label>
    <button class="btn btn-ghost btn-sm" onclick="toggleFilter()" aria-expanded="${state.filterOpen}">Filtrar${activeFilterCount() ? ' (' + activeFilterCount() + ')' : ''}</button>
    <label>Etiquetas <span class="hint" style="font-weight:400;">(se muestran ofertas que tengan alguna de las elegidas)</span></label>
    <div class="tp-chips">${used.map(s => `<button type="button" class="chip ${state.offerTags.includes(s) ? 'on' : ''} ${mine.includes(s) ? 'mine' : ''}" onclick="toggleOfferTag('${esc(s)}')">${esc(tagLabel(s))}</button>`).join('') || '<span class="hint">Todavía no hay ofertas con etiquetas.</span>'}</div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
      ${mine.length ? '<button class="btn btn-ghost btn-sm" onclick="useMyInterests()">Usar mis intereses</button>' : ''}
      <button class="btn btn-ghost btn-sm" onclick="clearFilters()">Limpiar filtros</button>
    </div></div>`
}
function toggleFilter(){ state.filterOpen = !state.filterOpen; render() }
function toggleOfferTag(s){ state.offerTags = state.offerTags.includes(s) ? state.offerTags.filter(x => x !== s) : [...state.offerTags, s]; render() }
function useMyInterests(){ state.offerTags = [...(state.currentUser.interests || [])]; render() }
function clearFilters(){ state.offerTags = []; state.offerFilter = 'all'; state.offerQuery = ''; render() }

/* ============ API CALLS - SUPABASE ============ */

function escapeLike(v){
  return String(v).replace(/[\\%_]/g, c => '\\' + c)
}

async function findByUsername(username){
  try {
    const { data, error } = await supabase
      .from('users')
      .select('*')
      .ilike('username', escapeLike(username))
    if(error){ console.error('Error:', error); return null }
    return (data || []).find(u => u.username.toLowerCase() === username.toLowerCase()) || null
  } catch(e){
    console.error('Error:', e)
    return null
  }
}

async function usernameExists(username){
  const u = await findByUsername(username)
  return !!u
}

async function registerUser(payload){
  const { data, error } = await supabase
    .from('users')
    .insert([payload])
    .select()
  if(error){
    console.error('Error en registerUser:', error)
    throw error
  }
  if(data && data[0]){
    state.allUsers.push(data[0])
    return data[0]
  }
  return null
}

async function linkTeenToTutor(tutor, teen){
  if(!tutor || !teen) return
  try {
    const arr = Array.from(new Set([...(tutor.tutored_students || []), String(teen.id)]))
    const { error } = await supabase.from('users').update({ tutored_students: arr }).eq('id', tutor.id)
    if(error) throw error
    tutor.tutored_students = arr
  } catch(e){
    console.warn('No se pudo actualizar tutored_students:', e)
  }
}

async function loginUser(username, password){
  const user = await findByUsername(username)
  return user && user.password === password ? user : null
}

async function createOffer(payload){
  if(!state.currentUser || state.currentUser.role !== 'employer'){
    throw new Error('Solo los empleadores pueden publicar ofertas.')
  }
  try {
    const { data, error } = await supabase
      .from('offers')
      .insert([{
        ...payload,
        employer_id: state.currentUser.id
      }])
      .select()
    
    if(error) throw error
    if(data && data[0]){
      state.allOffers.push(data[0])
      return data[0]
    }
  } catch(e){
    throw e
  }
}

async function createAssignment(offerId, studentId, status='pending'){
  try {
    const { data, error } = await supabase
      .from('assignments')
      .insert([{
        offer_id: offerId,
        student_id: studentId,
        status: status
      }])
      .select()
    
    if(error) throw error
    if(data && data[0]){
      state.allAssignments.push(data[0])
      return data[0]
    }
  } catch(e){
    throw e
  }
}

async function updateOffer(offerId, updates){
  try {
    const { data, error } = await supabase
      .from('offers')
      .update(updates)
      .eq('id', offerId)
      .select()
    
    if(error) throw error
    return data?.[0] || null
  } catch(e){
    throw e
  }
}

function renderLogin(){
  const main = document.getElementById('main')
  const topbar = document.getElementById('topbar')

  main.innerHTML = `
    <div class="screen auth-only">
      <img class="auth-logo" src="assets/logo-atr-circulo.png" alt="ATR, Adolescentes Trabajadores Regulados">
      <div class="card">
        <p class="eyebrow mono">Bienvenido de nuevo</p>
        <h1 class="title">Iniciá sesión en ATR</h1>
        <p class="subtitle">Plataforma segura para adolescentes trabajadores regulados.</p>

        <label class="req">Usuario</label>
        <input type="text" id="loginUser" placeholder="tu_usuario" autocomplete="username">

        <label class="req">Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">

        <div class="success-box ${state.flash ? 'show' : ''}" id="loginOk">${esc(state.flash)}</div>
        <div class="error-box" id="loginError"></div>
        <button class="btn btn-primary" id="loginBtn">Ingresar</button>
        <div class="link-row">¿No tenés cuenta? <a id="goRegister">Registrate</a></div>
      </div>
    </div>
  `

  state.flash = ''
  document.getElementById('goRegister').onclick = () => go('roleSelect')
  
  const btn = document.getElementById('loginBtn')
  const errBox = document.getElementById('loginError')

  btn.onclick = async () => {
    hideBox(errBox)
    const username = document.getElementById('loginUser').value.trim()
    const password = document.getElementById('loginPass').value

    if(!username || !password){
      showBox(errBox, 'Completá usuario y contraseña.')
      return
    }

    setLoading(btn, true, 'Ingresar')
    try {
      await loadAllData()
      const user = await loginUser(username, password)
      if(!user){
        showBox(errBox, 'Usuario o contraseña incorrectos.')
      } else {
        state.currentUser = state.allUsers.find(u => u.id === user.id) || user
        localStorage.setItem('atr_session', JSON.stringify({
          id: user.id, username: user.username, role: user.role, fullName: user.full_name || user.company_name
        }))
        go('dashboard','home')
      }
    } catch(e){
      showBox(errBox, 'Error de conexión: ' + e.message)
      console.error(e)
    } finally {
      setLoading(btn, false, 'Ingresar')
    }
  }
}

/* ============ RENDER: DASHBOARD ============ */
const ALLOWED_CATEGORIES = ['tutoria','diseno','edicion','programacion','redaccion','apoyo_escolar']
const CATEGORY_LABELS = {
  tutoria:'Tutoría académica', diseno:'Diseño gráfico', edicion:'Edición de video/contenido',
  programacion:'Programación/desarrollo web', redaccion:'Redacción y contenidos', apoyo_escolar:'Apoyo escolar'
}
const STATUS_LABELS = { pending:'⏳ Pendiente', approved:'✅ Aprobada', rejected:'❌ Rechazada' }

function displayName(u){
  return u ? (u.full_name || u.company_name || u.username) : '—'
}

/* --- helpers de relaciones --- */
function offerById(id){ return state.allOffers.find(o => o.id === id) }
function userById(id){ return state.allUsers.find(u => u.id === id) }
function assignmentsOfStudent(studentId){ return state.allAssignments.filter(a => a.student_id === studentId) }
function assignmentFor(offerId, studentId){
  return state.allAssignments.find(a => a.offer_id === offerId && a.student_id === studentId) || null
}
function approvedJobsOfStudent(studentId){
  return assignmentsOfStudent(studentId)
    .filter(a => a.status === 'approved')
    .map(a => ({ assignment: a, offer: offerById(a.offer_id) }))
    .filter(x => x.offer)
}
function studentsOfTutor(tutorId){
  return state.allUsers.filter(u => u.role === 'teen' && u.tutor_id === tutorId)
}

/* --- validación de compatibilidad horaria --- */
function checkOfferCompat(teen, offer){
  if(!ALLOWED_CATEGORIES.includes(offer.category)){
    return { ok:false, reason:'Esta oferta pertenece a una categoría no permitida para menores.' }
  }
  if(timeSlotCollides(offer.start_time, offer.end_time, [[teen.school_start, teen.school_end]])){
    return { ok:false, reason:'Esta oferta colisiona con tu horario escolar.' }
  }
  if(timeSlotCollides(offer.start_time, offer.end_time, [['20:00','08:00']])){
    return { ok:false, reason:'Esta oferta cae en la franja de descanso obligatorio (20:00-08:00).' }
  }
  const others = approvedJobsOfStudent(teen.id).filter(x => x.offer.id !== offer.id)
  const clash = others.find(x => timeSlotCollides(offer.start_time, offer.end_time, [[x.offer.start_time, x.offer.end_time]]))
  if(clash){
    return { ok:false, reason:`Esta oferta colisiona con un trabajo ya asignado (${clash.offer.title}).` }
  }
  return { ok:true, reason:'' }
}

function calendarJobs(){
  const user = state.currentUser
  let list = []
  if(user.role === 'teen'){
    list = approvedJobsOfStudent(user.id).map(x => ({ offer: x.offer, who: null }))
  } else if(user.role === 'tutor'){
    studentsOfTutor(user.id).forEach(s => {
      approvedJobsOfStudent(s.id).forEach(x => list.push({ offer: x.offer, who: s.full_name }))
    })
  } else if(user.role === 'employer'){
    state.allAssignments.filter(a => a.status === 'approved').forEach(a => {
      const offer = offerById(a.offer_id)
      if(offer && offer.employer_id === user.id){
        const s = userById(a.student_id)
        list.push({ offer, who: s ? s.full_name : null })
      }
    })
  }
  return list.sort((a, b) => toMinutes(a.offer.start_time) - toMinutes(b.offer.start_time))
}

function renderCalendarComponent(){
  const days = getWeekDays()
  const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado']
  const user = state.currentUser
  const jobs = calendarJobs()

  return `
    <div class="card">
      <div class="calendar-header">
        <h2 class="card-title">📅 Calendario de Control Horario</h2>
        <div class="calendar-nav">
          <button onclick="prevWeek()">← Semana anterior</button>
          <button onclick="nextWeek()">Siguiente semana →</button>
        </div>
      </div>

      <div class="week-view">
        ${days.map((d, i) => {
          const isToday = new Date().toDateString() === d.toDateString()
          const isWeekend = i === 0 || i === 6
          const dateStr = d.toLocaleDateString('es-ES', {day: '2-digit', month: '2-digit'})
          const dayName = dayNames[d.getDay()]

          const slots = []
          if(user.role === 'teen'){
            slots.push(`<div class="time-slot school">🎓 Escuela: ${esc(user.school_start)}-${esc(user.school_end)}</div>`)
          } else if(user.role === 'tutor'){
            studentsOfTutor(user.id).forEach(s => {
              slots.push(`<div class="time-slot school">🎓 ${esc(s.full_name)}: ${esc(s.school_start)}-${esc(s.school_end)}</div>`)
            })
          }
          slots.push(`<div class="time-slot blocked">🚫 Descanso: 20:00-08:00</div>`)
          jobs.forEach(j => {
            slots.push(`<div class="time-slot work">💼 ${esc(j.offer.title)} ${esc(j.offer.start_time)}-${esc(j.offer.end_time)}${j.who ? `<br>👤 ${esc(j.who)}` : ''}</div>`)
          })

          return `
            <div class="day-cell ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">
              <div class="day-header">${dayName}</div>
              <div class="day-date">${dateStr}</div>
              ${slots.join('')}
            </div>

        }).join('')}
      </div>

        <div class="legend-item"><div class="legend-color" style="background:var(--amber);"></div> Horario Escolar</div>
        <div class="legend-item"><div class="legend-color" style="background:#FFE7ED;"></div> Descanso Obligatorio</div>

/* ============ ACCIONES ============ */
async function syncApplicationArrays(offerId, studentId){
  // Mantiene coherentes offers.student_applications y users.applications con assignments
  try {
    const offer = offerById(offerId)
    const student = userById(studentId)
    if(offer){
      const arr = Array.from(new Set([...(offer.student_applications || []), String(studentId)]))
      const updated = await updateOffer(offerId, { student_applications: arr })
      if(updated) Object.assign(offer, updated)
    }
    if(student){
      const arr = Array.from(new Set([...(student.applications || []), String(offerId)]))
      const { data, error } = await supabase.from('users').update({ applications: arr }).eq('id', studentId).select()
      if(!error && data && data[0]){
        Object.assign(student, data[0])
        if(state.currentUser && state.currentUser.id === studentId) state.currentUser = student
      }
    }
  } catch(e){
    console.warn('No se pudieron sincronizar los arrays auxiliares:', e)
  }
}

async function applyForOffer(offerId){
  try {
    const user = state.currentUser
    const offer = offerById(offerId)
    if(!user || user.role !== 'teen' || !offer) return

    if(assignmentFor(offerId, user.id)){
      alert('Ya te postulaste a esta oferta.')
      return
    }
    const compat = checkOfferCompat(user, offer)
    if(!compat.ok){
      alert('🚫 No podés postularte: ' + compat.reason)
      return
    }
    await createAssignment(offerId, user.id, 'pending')
    await syncApplicationArrays(offerId, user.id)
    alert('✓ Te postulaste a esta oferta. Tu tutor deberá aprobarla.')
    render()
  } catch(e){
    console.error(e)
    alert('Error al postularte: ' + (e.message || e))
  }
}

async function setAssignmentStatus(assignmentId, status){
  const { data, error } = await supabase
    .from('assignments')
    .update({ status })
    .eq('id', assignmentId)
    .select()
  if(error) throw error
  const local = state.allAssignments.find(a => a.id === assignmentId)
  if(local && data && data[0]) Object.assign(local, data[0])
  return local
}

async function approveAssignment(assignmentId){
  try {
    const a = state.allAssignments.find(x => x.id === assignmentId)
    if(!a) return
    const student = userById(a.student_id)
    const offer = offerById(a.offer_id)
    if(!student || !offer) return
    if(student.tutor_id !== state.currentUser.id){
      alert('Solo el tutor del menor puede aprobar esta postulación.')
      return
    }
    const compat = checkOfferCompat(student, offer)
    if(!compat.ok){
      alert('🚫 No se puede aprobar: ' + compat.reason)
      return
    }
    await setAssignmentStatus(assignmentId, 'approved')
    render()
  } catch(e){
    console.error(e)
    alert('Error al aprobar: ' + (e.message || e))
  }
}

async function rejectAssignment(assignmentId){
  try {
    const a = state.allAssignments.find(x => x.id === assignmentId)
    if(!a) return
    const student = userById(a.student_id)
    if(!student || student.tutor_id !== state.currentUser.id){
      alert('Solo el tutor del menor puede rechazar esta postulación.')
      return
    }
    await setAssignmentStatus(assignmentId, 'rejected')
    render()
  } catch(e){
    console.error(e)
    alert('Error al rechazar: ' + (e.message || e))
  }
}

async function saveSchoolHours(){
  const errBox = document.getElementById('profileError')
  hideBox(errBox)
  const user = state.currentUser
  const start = document.getElementById('profSchoolStart')?.value
  const end = document.getElementById('profSchoolEnd')?.value
  if(!start || !end){ showBox(errBox, 'Completá ambos horarios.'); return }
  if(start >= end){ showBox(errBox, 'El horario de inicio debe ser anterior al de fin.'); return }
  const clash = approvedJobsOfStudent(user.id).find(x => timeSlotCollides(x.offer.start_time, x.offer.end_time, [[start, end]]))
  if(clash){
    showBox(errBox, `El nuevo horario colisiona con tu trabajo asignado "${clash.offer.title}".`)
    return
  }
  try {
    const { data, error } = await supabase.from('users').update({ school_start: start, school_end: end }).eq('id', user.id).select()
    if(error) throw error
    if(data && data[0]){
      Object.assign(user, data[0])
      const inList = userById(user.id)
      if(inList && inList !== user) Object.assign(inList, data[0])
    }
    alert('✓ Horario escolar actualizado')
    render()
  } catch(e){
    showBox(errBox, 'Error: ' + e.message)
    console.error(e)
  }
}

async function submitCreateOffer(){
  const errBox = document.getElementById('offerError')
  hideBox(errBox)
  const title = document.getElementById('offerTitle')?.value.trim()
  const category = document.getElementById('offerCategory')?.value
  const description = document.getElementById('offerDescription')?.value.trim()
  const startTime = document.getElementById('offerStartTime')?.value
  const endTime = document.getElementById('offerEndTime')?.value
  const pay = parseInt(document.getElementById('offerPay')?.value, 10)
  const tags = document.getElementById('offerTagsPicker')?._get?.() || []

  if(!title || !category || !description || !startTime || !endTime || !document.getElementById('offerPay').value){
    showBox(errBox, 'Completá todos los campos.')
    return
  }
  if(tags.length < 1){
    showBox(errBox, 'Elegí al menos una etiqueta para el trabajo.')
    return
  }
  if(!ALLOWED_CATEGORIES.includes(category)){
    showBox(errBox, 'La categoría seleccionada no está permitida para menores.')
    return
  }
  if(startTime >= endTime){
    showBox(errBox, 'La hora de inicio debe ser anterior a la hora de fin.')
    return
  }
  if(isNaN(pay) || pay <= 0){
    showBox(errBox, 'La paga por hora debe ser mayor a 0.')
    return
  }
  if(timeSlotCollides(startTime, endTime, [['20:00','08:00']])){
    showBox(errBox, 'No se permiten ofertas en la franja nocturna (20:00-08:00).')
    return
  }

  try {
    await createOffer({
      title, category, description, tags,
      start_time: startTime,
      end_time: endTime,
      pay,
      company_name: state.currentUser.company_name,
      student_applications: []
    })
    alert('✓ Oferta publicada')
    state.currentTab = 'offers'
    render()
  } catch(e){
    showBox(errBox, 'Error: ' + e.message)
    console.error(e)
  }
}

/* ============ SHELL CANVA: nav, panel de perfil, Inicio, Notificaciones ============ */
function navTo(btn){ changeDashboardTab(btn.dataset.tab) }
function setOfferQuery(v){ state.offerQuery = v; render() }
function jobsTabFor(user){ return user.role === 'tutor' ? 'applications' : 'offers' }

function notificationsFor(user){
  const list = []
  const asg = state.allAssignments
  if(user.role === 'tutor'){
    const ids = studentsOfTutor(user.id).map(t => t.id)
    asg.filter(a => ids.includes(a.student_id) && a.status === 'pending').forEach(a => {
      const t = userById(a.student_id), o = offerById(a.offer_id); if(!t || !o) return
      list.push({ id:a.id, pending:true, text:`${displayName(t)} quiere postularse a “${o.title}”`, sub:`${o.company_name} · ${o.start_time}–${o.end_time}. Revisala en Postulaciones.` })
    })
  } else if(user.role === 'teen'){
    asg.filter(a => a.student_id === user.id && a.status !== 'pending').forEach(a => {
      const o = offerById(a.offer_id); if(!o) return
      list.push({ id:a.id, pending:false, text:`Tu postulación a “${o.title}” fue ${a.status === 'approved' ? 'aprobada' : 'rechazada'}`, sub:`${o.company_name} · ${o.start_time}–${o.end_time}` })
    })
  } else {
    const mine = state.allOffers.filter(o => o.employer_id === user.id).map(o => o.id)
    asg.filter(a => mine.includes(a.offer_id)).forEach(a => {
      const t = userById(a.student_id), o = offerById(a.offer_id); if(!t || !o) return
      const st = { pending:'está pendiente de aprobación', approved:'fue aprobada por su tutor', rejected:'fue rechazada por su tutor' }[a.status]
      list.push({ id:a.id, pending:a.status === 'pending', text:`La postulación de ${displayName(t)} a “${o.title}” ${st}`, sub:o.company_name })
    })
  }
  return list.sort((a, b) => b.id - a.id)
}

function renderNotifications(){
  const items = notificationsFor(state.currentUser)
  return `<div class="card"><h2 class="card-title" style="margin-bottom:16px;">Notificaciones</h2>` + (items.length === 0
    ? `<p style="color:var(--ink-soft);">No tenés novedades por ahora. Cuando haya postulaciones o cambios de estado, aparecen acá.</p>`
    : items.map(n => `<div class="notif ${n.pending ? '' : 'ok'}"><span class="dot"></span><div>${esc(n.text)}<small>${esc(n.sub)}</small></div></div>`).join('')) + `</div>`
}

function profilePanel(u){
  const rows = []
  if(u.role === 'teen'){
    const jobs = approvedJobsOfStudent(u.id).length
    rows.push(['Usuario', u.username], ['Tutor', u.tutor_username || '—'], ['Escuela', `${u.school_start} – ${u.school_end}`], ['Disponibilidad', `${u.school_end} – 20:00`], ['Trabajos aprobados', jobs])
  } else if(u.role === 'tutor'){
    rows.push(['Usuario', u.username], ['Email', u.email || '—'], ['Menores a cargo', studentsOfTutor(u.id).length])
  } else {
    rows.push(['Usuario', u.username], ['Contacto', u.contact_name || '—'], ['Estado', u.verified ? 'Empresa verificada' : 'Sin verificar'])
  }
  const tags = u.role === 'teen' && (u.interests || []).length ? `<div class="profile-row"><b>Intereses</b><div class="tags">${u.interests.map(k => `<span class="tag">${esc(tagLabel(k))}</span>`).join('')}</div></div>` : ''
  const role = u.role === 'tutor' ? 'Tutor Legal' : u.role === 'teen' ? 'Trabajador' : 'Empleador'
  return `<div class="profile-panel"><div class="profile-head"><div class="user-avatar">${esc(getInitial(displayName(u)))}</div><div><strong>${esc(displayName(u))}</strong><span>${role}</span></div></div>
    ${rows.map(r => `<div class="profile-row"><b>${esc(r[0])}:</b> ${esc(r[1])}</div>`).join('')}${tags}</div>`
}

function decorateShell(){
  const user = state.currentUser, tab = state.currentTab
  document.querySelectorAll('#mainNav [data-nav]').forEach(b => {
    const t = b.dataset.nav === 'jobs' ? jobsTabFor(user) : b.dataset.nav
    b.dataset.tab = t
    b.classList.toggle('active', tab === t)
    if(tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current')
  })
  const n = notificationsFor(user).filter(x => x.pending).length
  const dot = document.getElementById('notifCount'); dot.textContent = n; dot.hidden = n === 0
  const dm = document.querySelector('.dashboard-main')
  if(dm && tab === 'home') dm.innerHTML = renderHome()
  else if(dm && tab === 'notifications') dm.innerHTML = renderNotifications()
  const sb = document.querySelector('.sidebar')
  if(sb){
    sb.querySelectorAll('.sidebar-item').forEach(el => { const t = el.firstChild; if(t && t.nodeType === 3) t.textContent = t.textContent.replace(/^[^\p{L}\p{N}]+/u, '') })
    sb.insertAdjacentHTML('afterbegin', profilePanel(user))
  }
}
